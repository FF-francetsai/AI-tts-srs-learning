<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage 選擇中介頁｜iPAS AI 應用規劃智策網學院</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0f0;
    font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    line-height: 1.7;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .topbar a { color: #8b8ba0; text-decoration: none; font-size: 14px; transition: color .2s; }
  .topbar a:hover { color: #a78bfa; }
  .topbar .right-links { display: flex; gap: 18px; }
  .stage-head { text-align: center; margin-bottom: 36px; }
  .stage-icon { font-size: 48px; margin-bottom: 8px; }
  .stage-title {
    font-size: 28px; font-weight: 700; margin-bottom: 6px;
    background: linear-gradient(135deg, #a78bfa, #7dd3fc, #34d399);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .stage-sub { color: #8b8ba0; font-size: 14px; }
  .term-count-badge {
    display: inline-block; margin-top: 14px; padding: 4px 14px;
    background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.3);
    border-radius: 999px; color: #e8e8f8; font-size: 13px;
  }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
  .card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 28px 22px; text-decoration: none; color: inherit;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    transition: transform .25s, box-shadow .25s; cursor: pointer;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 32px rgba(167,139,250,0.25), 0 0 0 1px rgba(167,139,250,0.3);
  }
  .card-icon { font-size: 36px; margin-bottom: 14px; }
  .card-name { font-size: 18px; font-weight: 600; color: #e8e8f8; margin-bottom: 10px; }
  .card-desc { font-size: 13px; color: #8b8ba0; line-height: 1.6; }
  .chapter-section { margin-top: 12px; }
  .chapter-section h2 {
    font-size: 18px; color: #e8e8f8; margin-bottom: 16px;
    border-left: 3px solid #a78bfa; padding-left: 10px;
  }
  .chapter-item {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 12px;
  }
  .chapter-item .ch-title { font-size: 15px; font-weight: 600; color: #e8e8f8; margin-bottom: 6px; }
  .chapter-item .ch-cats { font-size: 12px; color: #7dd3fc; margin-bottom: 8px; }
  .chapter-item .ch-intro { font-size: 13px; color: #8b8ba0; line-height: 1.6; }
  @media (max-width: 720px) {
    .cards { grid-template-columns: 1fr; }
    .stage-title { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html">← 回首頁選起點</a>
    <div class="right-links">
      <a href="vocab.html">全部術語庫</a>
    </div>
  </div>

  <div class="stage-head">
    <div class="stage-icon" id="stageIcon"></div>
    <div class="stage-title" id="stageTitle"></div>
    <div class="stage-sub" id="stageSub"></div>
    <div class="term-count-badge" id="termBadge"></div>
  </div>

  <div class="cards">
    <a class="card" id="cardVocab" href="#">
      <div class="card-icon">📖</div>
      <div class="card-name">互動詞庫</div>
      <div class="card-desc" id="vocabDesc"></div>
    </a>
    <a class="card" id="cardAtlas" href="#">
      <div class="card-icon">🔮</div>
      <div class="card-name">知識星圖</div>
      <div class="card-desc">該 Stage 的術語節點與關聯，其餘節點隱藏</div>
    </a>
    <a class="card" id="cardLearn" href="#">
      <div class="card-icon">📊</div>
      <div class="card-name">SRS 複習進度</div>
      <div class="card-desc">間隔重複記憶，追蹤每個術語的熟練度</div>
    </a>
  </div>

  <div class="chapter-section" id="chapterSection" style="display:none;">
    <h2>章節導讀</h2>
    <div id="chapterList"></div>
  </div>
</div>

<script src="data.js?v=20260711"></script>
<script>
(function() {
  const STAGE_META = {
    '0': { icon: '✦',  name: 'AI 入門' },
    '1': { icon: '🪐', name: 'iPAS 初級' },
    '2': { icon: '🧠', name: '中級技術' },
    '3': { icon: '⚡', name: '中級數據' }
  };

  const params = new URLSearchParams(window.location.search);
  const stageId = params.get('stage');
  if (!stageId || !STAGE_META[stageId]) {
    window.location.href = 'index.html';
    return;
  }

  const meta = STAGE_META[stageId];

  // 統計術語數
  const allTerms = [];
  if (typeof lessonData !== 'undefined') {
    lessonData.forEach(function(item) {
      if (item.title) {
        allTerms.push({ title: item.title, stage: item.stage != null ? String(item.stage) : '' });
      }
    });
  }
  const termCount = allTerms.filter(function(t) { return t.stage === stageId; }).length;

  // 填入頁首
  document.getElementById('stageIcon').textContent = meta.icon;
  document.getElementById('stageTitle').textContent = 'Stage ' + stageId + '：' + meta.name;
  document.getElementById('stageSub').textContent = '選擇你想用的學習方式';
  document.getElementById('termBadge').textContent = '本 Stage 收錄 ' + termCount + ' 個術語';

  // 卡片連結與描述
  document.getElementById('cardVocab').href = 'vocab.html?stage=' + stageId;
  document.getElementById('vocabDesc').textContent = '🔍 搜尋 ' + termCount + ' 個術語';
  document.getElementById('cardAtlas').href = 'atlas.html?stage=' + stageId;
  document.getElementById('cardLearn').href = 'learn.html?stage=' + stageId;

  // fetch 章節導讀（失敗靜默降級）
  fetch('content/stage_chapter_guides.json')
    .then(function(r) { return r.json(); })
    .then(function(g) {
      const chapters = g['stage' + stageId];
      if (!chapters || !chapters.length) return;
      const list = document.getElementById('chapterList');
      let html = '';
      chapters.forEach(function(ch, i) {
        const cats = (ch.categories || []).join('、');
        html += '<div class="chapter-item">';
        html += '<div class="ch-title">第 ' + (i + 1) + ' 章：' + escapeHtml(ch.chapter) + '</div>';
        if (cats) html += '<div class="ch-cats">' + escapeHtml(cats) + '</div>';
        html += '<div class="ch-intro">' + escapeHtml(ch.intro) + '</div>';
        html += '</div>';
      });
      list.innerHTML = html;
      document.getElementById('chapterSection').style.display = 'block';
    })
    .catch(function() { /* 靜默降級，不顯示章節區塊 */ });

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
