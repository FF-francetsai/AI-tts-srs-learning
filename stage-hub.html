<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0f0;
    font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    line-height: 1.7;
  }
  #bg-canvas {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 0; pointer-events: none;
  }
  .wrap { position: relative; z-index: 10; max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .topbar a { color: #8b8ba0; text-decoration: none; font-size: 14px; transition: color .2s; }
  .topbar a:hover { color: #a78bfa; }
  .topbar .right-links { display: flex; gap: 18px; }
  .stage-head { text-align: center; margin-bottom: 36px; }
  .stage-icon { font-size: 48px; margin-bottom: 8px; }
  .stage-title {
    font-size: 28px; font-weight: 700; margin-bottom: 6px;
    background: linear-gradient(135deg, #a78bfa, #7dd3fc, #34d399);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .stage-sub { color: #8b8ba0; font-size: 14px; }
  .term-count-badge {
    display: inline-block; margin-top: 14px; padding: 4px 14px;
    background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.3);
    border-radius: 999px; color: #e8e8f8; font-size: 13px;
  }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
  .card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 28px 22px; text-decoration: none; color: inherit;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    transition: transform .25s, box-shadow .25s; cursor: pointer;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 32px rgba(167,139,250,0.25), 0 0 0 1px rgba(167,139,250,0.3);
  }
  .card-icon { font-size: 36px; margin-bottom: 14px; }
  .card-name { font-size: 18px; font-weight: 600; color: #e8e8f8; margin-bottom: 10px; }
  .card-desc { font-size: 13px; color: #8b8ba0; line-height: 1.6; }
  .chapter-section { margin-top: 12px; }
  .chapter-section h2 {
    font-size: 18px; color: #e8e8f8; margin-bottom: 16px;

  .chapter-item .ch-title { font-size: 15px; font-weight: 600; color: #e8e8f8; margin-bottom: 6px; }
  .chapter-item .ch-cats { font-size: 12px; color: #7dd3fc; margin-bottom: 8px; }
  .chapter-item .ch-intro { font-size: 13px; color: #8b8ba0; line-height: 1.6; }
  @media (max-width: 720px) {

<script src="data.js?v=20260711"></script>
<script>
(function() {
  const STAGE_META = {
    '0': { icon: '✦',  name: 'AI 入門' },
    '1': { icon: '🪐', name: 'iPAS 初級' },
    '2': { icon: '🧠', name: '中級技術' },
    '3': { icon: '⚡', name: '中級數據' }
  };

  const params = new URLSearchParams(window.location.search);
  const stageId = params.get('stage');
  if (!stageId || !STAGE_META[stageId]) {
    window.location.href = 'index.html';
    return;
  }

  const meta = STAGE_META[stageId];

  // 統計術語數
  const allTerms = [];
  if (typeof lessonData !== 'undefined') {
    lessonData.forEach(function(item) {
      if (item.title) {
        allTerms.push({ title: item.title, stage: item.stage != null ? String(item.stage) : '' });
      }
    });
  }
  const termCount = allTerms.filter(function(t) { return t.stage === stageId; }).length;

  // 填入頁首
  document.getElementById('stageIcon').textContent = meta.icon;
  document.getElementById('stageTitle').textContent = meta.name;
  document.getElementById('stageSub').textContent = '選擇你想用的學習方式';
  document.getElementById('termBadge').textContent = '本 Stage 收錄 ' + termCount + ' 個術語';

  // 卡片連結與描述
  document.getElementById('cardVocab').href = 'vocab.html?stage=' + stageId;
  document.getElementById('vocabDesc').textContent = '🔍 搜尋 ' + termCount + ' 個術語';
  document.getElementById('cardAtlas').href = 'atlas.html?stage=' + stageId;
  document.getElementById('cardLearn').href = 'learn.html?stage=' + stageId;

  // fetch 章節導讀（失敗靜默降級）
  fetch('content/stage_chapter_guides.json')
    .then(function(r) { return r.json(); })
    .then(function(g) {
      const chapters = g['stage' + stageId];
      if (!chapters || !chapters.length) return;
      const list = document.getElementById('chapterList');
      let html = '';
      chapters.forEach(function(ch, i) {
        const cats = (ch.categories || []).join('、');
        html += '<div class="chapter-item">';
        html += '<div class="ch-title">第 ' + (i + 1) + ' 章：' + escapeHtml(ch.chapter) + '</div>';
        if (cats) html += '<div class="ch-cats">' + escapeHtml(cats) + '</div>';
        html += '<div class="ch-intro">' + escapeHtml(ch.intro) + '</div>';
        html += '</div>';
      });
      list.innerHTML = html;
      document.getElementById('chapterSection').style.display = 'block';
    })
    .catch(function() { /* 靜默降級，不顯示章節區塊 */ });

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
<!-- Three.js 神經光粒子背景（與 index.html 同一份效果） -->
<script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const canvas = document.getElementById('bg-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;

        const PARTICLE_COUNT = 2500;
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const sizes = new Float32Array(PARTICLE_COUNT);

        const palette = [
            new THREE.Color('#a78bfa'),
            new THREE.Color('#fbbf24'),
            new THREE.Color('#34d399'),
            new THREE.Color('#7dd3fc'),
            new THREE.Color('#f472b6'),
        ];

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            positions[i3]     = (Math.random() - 0.5) * 100;
            positions[i3 + 1] = (Math.random() - 0.5) * 100;
            positions[i3 + 2] = (Math.random() - 0.5) * 60;
            const c = palette[Math.floor(Math.random() * palette.length)];
            colors[i3]     = c.r;
            colors[i3 + 1] = c.g;
            colors[i3 + 2] = c.b;
            sizes[i] = Math.random() * 2.0 + 0.5;
        }

        const particleGeo = new THREE.BufferGeometry();
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const particleMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uPixelRatio: { value: renderer.getPixelRatio() }
            },
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                uniform float uTime;
                uniform float uPixelRatio;
                varying vec3 vColor;
                varying float vAlpha;
                void main() {
                    vColor = color;
                    vec3 pos = position;
                    pos.x += sin(uTime * 0.15 + position.y * 0.05) * 1.5;
                    pos.y += cos(uTime * 0.12 + position.x * 0.04) * 1.2;
                    pos.z += sin(uTime * 0.1  + position.z * 0.03) * 0.8;
                    vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = size * uPixelRatio * (40.0 / -mvPos.z);
                    gl_PointSize = max(gl_PointSize, 1.0);
                    gl_Position = projectionMatrix * mvPos;
                    vAlpha = smoothstep(0.0, 0.3, size / 2.5);
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                varying float vAlpha;
                void main() {
                    float d = length(gl_PointCoord - 0.5);
                    if (d > 0.5) discard;
                    float glow = 1.0 - smoothstep(0.0, 0.5, d);
                    gl_FragColor = vec4(vColor, glow * vAlpha * 0.85);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        const LINE_COUNT = 300;
        const linePositions = new Float32Array(LINE_COUNT * 6);
        const lineColors = new Float32Array(LINE_COUNT * 6);
        const lineGeo = new THREE.BufferGeometry();
        lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        lineGeo.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));

        const lineMat = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 0.2,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const lines = new THREE.LineSegments(lineGeo, lineMat);
        scene.add(lines);

        function updateLines() {
            const posArr = particleGeo.attributes.position.array;
            const colArr = particleGeo.attributes.color.array;
            let lineIdx = 0;
            const maxDist = 12;
            for (let i = 0; i < Math.min(PARTICLE_COUNT, 400) && lineIdx < LINE_COUNT; i++) {
                for (let j = i + 1; j < Math.min(PARTICLE_COUNT, 400) && lineIdx < LINE_COUNT; j++) {
                    const dx = posArr[i*3]   - posArr[j*3];
                    const dy = posArr[i*3+1] - posArr[j*3+1];
                    const dz = posArr[i*3+2] - posArr[j*3+2];
                    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    if (dist < maxDist) {
                        const li = lineIdx * 6;
                        linePositions[li]   = posArr[i*3];   linePositions[li+1] = posArr[i*3+1]; linePositions[li+2] = posArr[i*3+2];
                        linePositions[li+3] = posArr[j*3];   linePositions[li+4] = posArr[j*3+1]; linePositions[li+5] = posArr[j*3+2];
                        lineColors[li]   = colArr[i*3];      lineColors[li+1]   = colArr[i*3+1]; lineColors[li+2]   = colArr[i*3+2];
                        lineColors[li+3] = colArr[j*3];      lineColors[li+4]   = colArr[j*3+1]; lineColors[li+5]   = colArr[j*3+2];
                        lineIdx++;
                    }
                }
            }
            for (let k = lineIdx * 6; k < LINE_COUNT * 6; k++) linePositions[k] = 0;
            lineGeo.attributes.position.needsUpdate = true;
            lineGeo.attributes.color.needsUpdate = true;
        }

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.5, 0.3
        );
        composer.addPass(bloomPass);

        let lastLineUpdate = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            particleMat.uniforms.uTime.value = elapsed;
            particles.rotation.y = elapsed * 0.02;
            particles.rotation.x = Math.sin(elapsed * 0.01) * 0.1;
            lines.rotation.y = elapsed * 0.02;
            lines.rotation.x = Math.sin(elapsed * 0.01) * 0.1;
            if (elapsed - lastLineUpdate > 0.5) { updateLines(); lastLineUpdate = elapsed; }
            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        updateLines();
        animate();
    </script>
</body>
