# Cloudflare Worker: AI-tts-srs-proxy
# 部署指令：
#   1. 登入：npx wrangler login
#   2. 設定 HF token secret（只需執行一次）：
#      npx wrangler secret put HF_TOKEN
#      （執行後貼上你的 HF token，Enter 確認）
#   3. 設定 NVIDIA key（有 nvapi- key 時才需要）：
#      npx wrangler secret put NVIDIA_KEY
#   4. 部署：npx wrangler deploy
#   5. 複製輸出的 Worker URL，填入 js/providers.js 的 cf_worker_url

name               = "ai-tts-srs-proxy"
main               = "worker.js"
compatibility_date = "2024-09-23"
account_id         = "7767c1203e1ed370ffe42841ca2574cc"

# Cloudflare Workers AI binding（免費，無需額外 API key）
[ai]
binding = "AI"

# Secrets（API key 不寫在這裡！用 wrangler secret put 指令設定）:
#   HF_TOKEN   → Hugging Face 推論 token
#   NVIDIA_KEY → NVIDIA NIM Build API key（選配）
