<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPG 風格確認頁</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060b13;color:#cdd6f4;font-family:-apple-system,sans-serif;overflow-x:hidden}
h2{text-align:center;padding:18px 0 6px;font-size:14px;color:#7dd3fc;letter-spacing:1px}
p.note{text-align:center;font-size:11px;color:#475569;margin-bottom:12px}

/* ══ 角色展示區 ══ */
.char-row{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;padding:10px 20px 20px}
.char-card{display:flex;flex-direction:column;align-items:center;gap:8px}
.char-card span{font-size:11px;color:#94a3b8}

/* ══ 等角 2.5D 場景 ══ */
.iso-wrap{
  display:flex;justify-content:center;align-items:center;
  padding:20px 0 40px;
  background:radial-gradient(ellipse at 50% 30%,rgba(10,25,50,0.95) 0%,#060b13 70%);
}
.iso-scene{position:relative;width:700px;height:400px}

/* 等角地板格：CSS transform 模擬 isometric */
.tile{
  position:absolute;
  width:64px;height:32px;
  transform-origin:center center;
  transform:rotate(-45deg) skewX(0deg) scaleY(0.577);
}
/* 等角座標換算 macro */

/* 場景物件 */
.iso-obj{position:absolute;pointer-events:none}

/* chibi 精靈（站在地板上） */
.chibi-sprite{position:absolute;transform:translateX(-50%)}
</style>
</head>
<body>
