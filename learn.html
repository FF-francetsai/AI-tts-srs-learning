<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRS 智慧學習 · iPas AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="srs-core.css">
    <style>
        .v6-topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 44px;
            background: rgba(6,11,19,0.95); backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(125,211,252,0.15);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 9999; font-size: 13px;
        }
        .v6-topbar a { color: #7dd3fc; text-decoration: none; font-weight: 600; }
        .v6-topbar a:hover { opacity: .8; }
        .v6-voice-btn {
            background: linear-gradient(135deg, #34d399, #059669);
            border: none; color: #fff; padding: 5px 14px;
            border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .v6-voice-btn.voice-recording {
            background: linear-gradient(135deg, #ff7189, #e11d48);
            animation: v6pulse 1s infinite;
        }
        @keyframes v6pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
        #app { padding-top: 44px !important; }
        #voice-result-overlay {
            display: none; position: fixed; bottom: 80px;
            left: 50%; transform: translateX(-50%);
            background: rgba(6,11,19,0.92); border: 1px solid #7dd3fc;
            color: #cdd6f4; padding: 10px 20px; border-radius: 10px;
            font-size: 14px; z-index: 10000; max-width: 400px; text-align: center;
        }
    </style>

<style id="stage-banner-style">
.stage-banner {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 10px 20px;
  text-align: center;
  font-size: 1.1em;
  font-weight: bold;
  border-radius: 8px;
  margin: 10px 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.stage-banner .stage-label {
  font-size: 0.85em;
  opacity: 0.85;
  margin-right: 6px;
}
</style>

</head>

<body class="dark-theme">
    <div class="v6-topbar">
        <a href="index.html">← 返回首頁</a>
        <button class="v6-voice-btn" id="v6-voice-btn" data-voice-status>🎤 語音練習</button>
    </div>
    <div id="voice-result-overlay"></div>

    <div id="app" class="app-container">
        <header class="glass-panel main-header">
            <div class="header-top">
                <button id="menuBtn" class="icon-btn menu-toggle" title="切換導航選單">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <span>iPas AI 應用規畫師 AI SRS 智慧學習平台</span>
                </div>
                <div class="header-quick-actions">
                    <button id="toggleControlsBtn" class="control-btn menu-toggle" title="展開設定">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button id="toggleTheme" class="control-btn" title="切換深色 / 淺色主題">🌓</button>
                    <button class="icon-btn highlight" id="syncCloudBtn" title="同步雲端最新數據"
                        onclick="App.syncFromCloud()">
                        <i class="fas fa-rotate" id="syncBtn"></i>
                    </button>
                </div>
            </div>
            <div class="header-controls" id="headerControls">
                <div class="tts-engine-panel">
                    <div class="control-row">
                        <i class="fas fa-volume-up" style="color:var(--accent-color);font-size:0.9rem;"></i>
                        <span class="tts-label">發音引擎</span>
                        <select id="ttsEngineSelect" class="tts-engine-select">
                            <option value="browser" selected>💻 Microsoft 擬真人</option>
                            <option value="google">🌐 Google 真人</option>
                        </select>
                        <span class="tts-divider"></span>
                        <i class="fas fa-user" style="color:var(--text-dim);font-size:0.8rem;"></i>
                        <select id="ttsGenderSelect" class="tts-engine-select">
                            <option value="female" selected>♀ 女聲</option>
                            <option value="male">♂ 男聲</option>
                        </select>
                    </div>
                    <div class="control-row sliders">
                        <div class="slider-group">
                            <span class="ctrl-label">語速</span>
                            <div class="slider-container">
                                <input type="range" id="ttsRateSlider" min="0.1" max="2.0" step="0.1" value="0.5">
                                <span class="slider-val" id="ttsRateVal">0.5</span>
                            </div>
                        </div>
                        <div id="pitchControlGroup" class="slider-group">
                            <span class="ctrl-label">音調 <small>(系統)</small></span>
                            <div class="slider-container">
                                <input type="range" id="ttsPitchSlider" min="0.5" max="2.0" step="0.1" value="1.0">
                                <span class="slider-val" id="ttsPitchVal">1.0</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="header-row search-font-row">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="topicSearch" placeholder="搜尋術語、關鍵字...">
                    </div>
                    <div class="font-controls">
                        <button id="fontDown" class="control-btn">A-</button>
                        <button id="fontUp" class="control-btn">A+</button>
                    </div>
                </div>
                <div class="header-row mode-action-row">
                    <button id="srsToggle" class="control-btn" title="每日複習模式">
                        <i class="fas fa-graduation-cap"></i>
                        <span class="btn-text">每日複習</span>
                    </button>
                    <button id="headerWrongQuizBtn" class="control-btn secondary" title="錯題補救測驗">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span class="btn-text">錯題補救</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="main-layout">
            <aside class="sidebar glass-panel">
                <div class="sidebar-header">
                    <h3><i class="fas fa-brain"></i> iPas 學習導航</h3>
                    <div id="progressIndicator" class="progress-mini">
                        <span id="progressText">進度: 0%</span>
                        <div class="progress-bar-bg">
                            <div id="progressBar" class="progress-bar-fill"></div>
                        </div>
                    </div>
                </div>
                <nav id="sidebarNav" class="nav-container"></nav>
            </aside>
            <section class="content-area">
                <div id="topicContent" class="topic-container"></div>
                <div id="detailModal" class="detail-modal hidden">
                    <div class="detail-overlay" onclick="App.closeDetail()"></div>
                    <div class="detail-content glass-panel">
                        <button class="close-detail-btn" onclick="App.closeDetail()">
                            <i class="fas fa-times"></i>
                        </button>
                        <div id="detailBody"></div>
                    </div>
                </div>
                <div id="quizContainer" class="quiz-container glass-panel hidden">
                    <div class="quiz-header">
                        <span class="quiz-badge">Challenge</span>
                        <h3 id="quizQuestion">題目載入中...</h3>
                    </div>
                    <div id="quizOptions" class="quiz-options"></div>
                    <div id="quizFeedback" class="quiz-feedback hidden">
                        <div id="quizExplain" class="quiz-explain"></div>
                        <button id="nextQuestionBtn" class="control-btn next-btn hidden"
                            style="margin:20px auto;display:block;background:var(--accent-color);color:white;">
                            下一題 <i class="fas fa-arrow-right"></i>
                        </button>
                        <div id="srsActions" class="srs-actions hidden">
                            <p class="srs-prompt">這題對您來說難度如何？</p>
                            <div class="srs-btns">
                                <button class="srs-btn again" data-grade="0">Again (1d)</button>
                                <button class="srs-btn hard" data-grade="1">Hard (2d)</button>
                                <button class="srs-btn good" data-grade="2">Good (4d)</button>
                                <button class="srs-btn easy" data-grade="3">Easy (7d)</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="glass-panel main-footer">
            <div class="footer-info">
                <span>Power by AntiGravity &amp; SRS Memory System</span>
            </div>
            <div class="tts-voice-hint" style="font-size:0.75rem;color:var(--text-dim);">
                <i class="fas fa-info-circle"></i> 點擊學習卡上的喇叭圖示以指定引擎發音
            </div>
        </footer>
    </div>

    <script src="js/providers.js"></script>
    <script src="data.js?v=20260811"></script>
    <script src="quizzes.js?v=20260811"></script>
    <script src="rpg-audio-profiles.js"></script>
    <script src="app.js?v=5.4"></script>
    <script src="js/voice.js"></script>
    <script>
        (function() {
            const btn = document.getElementById('v6-voice-btn');
            const overlay = document.getElementById('voice-result-overlay');
            if (!btn || typeof VoiceInput === 'undefined') return;
            const voice = new VoiceInput();
            voice.onResult(function(res) {
                overlay.textContent = '辨識：' + res.text + '（' + res.engine + '）';
                overlay.style.display = 'block';
                var searchBox = document.getElementById('topicSearch');
                if (searchBox) {
                    searchBox.value = res.text;
                    searchBox.dispatchEvent(new Event('input'));
                }
                setTimeout(function() { overlay.style.display = 'none'; }, 4000);
            });
            voice.onError(function(e) {
                overlay.textContent = '語音辨識失敗：' + (e.message || '未知錯誤');
                overlay.style.display = 'block';
                setTimeout(function() { overlay.style.display = 'none'; }, 3000);
            });
            btn.addEventListener('click', function() {
                if (voice.recording) {
                    voice.stop();
                    btn.textContent = '🎤 語音練習';
                } else {
                    voice.start();
                    btn.textContent = '⏹ 停止錄音';
                }
            });
        })();
    </script>

<script id="stage-filter-script">
(function() {
  const STAGE_NAMES = {
    '0': 'AI入門',
    '1': 'iPAS初級',
    '2': '中級技術',
    '3': '中級數據'
  };

  function getStageFromURL() {
    const params = new URLSearchParams(window.location.search);
    const s = params.get('stage');
    if (s !== null && STAGE_NAMES.hasOwnProperty(s)) {
      return s;
    }
    return null;
  }

  function applyStageFilter() {
    const stage = getStageFromURL();
    if (stage === null) return; // 無參數，顯示全部

    // 插入或更新 Stage 橫幅
    let banner = document.getElementById('stage-banner');
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'stage-banner';
      banner.className = 'stage-banner';
      // 插到 body 最前面（或第一個主要容器前）
      const main = document.querySelector('main, .container, #app, body');
      if (main && main !== document.body) {
        main.parentNode.insertBefore(banner, main);
      } else {
        document.body.insertBefore(banner, document.body.firstChild);
      }
    }
    banner.innerHTML = '<span class="stage-label">目前 Stage：</span>' +
      'Stage ' + stage + ' — ' + STAGE_NAMES[stage];

    // 篩選術語卡片
    // 嘗試多種可能的卡片選擇器
    const selectors = [
      '.topic-link[data-stage]', '.term-card', '.card', '.term', '[data-term]',
      '.topic-card', '.item', '.vocab-item', '.glossary-item'
    ];

    let cards = [];
    for (const sel of selectors) {
      cards = document.querySelectorAll(sel);
      if (cards.length > 0) break;
    }

    if (cards.length === 0) {
      // 嘗試找所有包含 stage 屬性的元素
      cards = document.querySelectorAll('[stage]');
    }

    let visibleCount = 0;
    let hiddenCount = 0;

    cards.forEach(function(card) {
      // 嘗試從 data-stage 或 stage 屬性讀取
      let cardStage = card.getAttribute('data-stage') || card.getAttribute('stage');
      if (cardStage === null || cardStage === undefined || cardStage === '') {
        return; // 找不到 stage 屬性，不隱藏（避免誤隱藏）
      }
      cardStage = String(cardStage).trim();
      if (cardStage === stage) {
        card.style.display = '';
        visibleCount++;
      } else {
        card.style.display = 'none';
        hiddenCount++;
      }
    });

    console.log('[Stage Filter] stage=' + stage + ' 顯示=' + visibleCount + ' 隱藏=' + hiddenCount);
  }

  // DOMContentLoaded 或已載入時執行
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyStageFilter);
  } else {
    applyStageFilter();
  }

  // 若有動態渲染（從 data.js 載入後才生成卡片），用 MutationObserver 監聽
  const observer = new MutationObserver(function(mutations) {
    let shouldReapply = false;
    mutations.forEach(function(m) {
      if (m.addedNodes.length > 0) shouldReapply = true;
    });
    if (shouldReapply) {
      // debounce
      clearTimeout(window._stageFilterTimer);
      window._stageFilterTimer = setTimeout(applyStageFilter, 200);
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });

  // 5 秒後停止觀察（避免無限監聽）
  setTimeout(function() { observer.disconnect(); }, 5000);
})();
</script>

</body>

</html>
