<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動詞庫 · AI 術語字典</title>
  <style>
    :root {
      --bg: #060b13; --surface: rgba(11,15,25,0.9);
      --border: rgba(125,211,252,0.15); --accent: #7dd3fc;
      --text: #cdd6f4; --muted: #94a3b8;
      --cat-ml:  #a78bfa; --cat-dl:  #fbbf24; --cat-nn:  #34d399;
      --cat-gen: #7dd3fc; --cat-cv:  #f472b6; --cat-nlp: #fb923c;
      --cat-agt: #c084fc; --cat-def: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .v6-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px; height: 48px;
      background: rgba(6,11,19,0.97); border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .v6-topbar a { color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap; }
    .v6-topbar a:hover { color: var(--accent); }
    .v6-topbar .tb-title { color: var(--accent); font-weight: 600; font-size: 14px; }
    .v6-topbar .spacer { flex: 1; }
    .count-badge {
      font-size: 11px; color: var(--muted); background: rgba(125,211,252,0.08);
      border: 1px solid var(--border); padding: 2px 10px; border-radius: 12px;
      white-space: nowrap;
    }

    /* ── Search ── */
    .search-bar {
      padding: 20px 16px 8px;
      display: flex; gap: 10px; align-items: center;
    }
    #vocab-search {
      flex: 1; max-width: 560px; margin: 0 auto;
      background: rgba(11,15,25,0.9); border: 1px solid rgba(125,211,252,0.3);
      color: var(--text); padding: 10px 16px; border-radius: 20px;
      font-size: 14px; outline: none; display: block;
      transition: border-color .2s;
    }
    #vocab-search:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(125,211,252,0.15); }
    #vocab-search::placeholder { color: var(--muted); }

    /* ── Category tabs ── */
    .domain-nav {
      display: flex; gap: 6px; padding: 6px 16px 10px;
      overflow-x: auto; scrollbar-width: none;
    }
    .domain-nav::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex-shrink: 0; padding: 5px 14px; border-radius: 16px;
      border: 1px solid rgba(125,211,252,0.2); background: none;
      color: var(--muted); font-size: 12px; cursor: pointer;
      transition: all .2s; white-space: nowrap;
      display: flex; align-items: center; gap: 5px;
    }
    .cat-tab .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .cat-tab:hover { background: rgba(125,211,252,0.07); }
    .cat-tab.active {
      border-color: var(--tab-color, var(--accent));
      color: var(--tab-color, var(--accent));
      background: rgba(125,211,252,0.08);
    }

    /* ── Stats bar ── */
    .stats-bar {
      padding: 4px 16px 12px;
      font-size: 12px; color: var(--muted);
    }

    /* ── Card grid ── */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px; padding: 0 16px 80px;
    }

    /* ── Term card ── */
    .term-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
      border-left: 3px solid var(--card-color, var(--cat-def));
      cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .2s;
      display: flex; flex-direction: column; gap: 6px;
    }
    .term-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      border-color: var(--card-color, var(--accent));
    }
    .card-header { display: flex; align-items: flex-start; gap: 8px; }
    .card-cat-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--card-color, var(--cat-def));
      flex-shrink: 0; margin-top: 4px;
    }
    .card-titles { flex: 1; min-width: 0; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .card-eng { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .card-cat-badge {
      font-size: 10px; padding: 2px 7px; border-radius: 8px;
      background: rgba(125,211,252,0.08); color: var(--card-color, var(--muted));
      border: 1px solid rgba(125,211,252,0.15); white-space: nowrap; flex-shrink: 0;
    }
    .card-def {
      font-size: 12px; line-height: 1.65; color: var(--muted);
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .term-card.expanded .card-def {
      display: block; -webkit-line-clamp: unset;
    }
    /* Expanded: show extra info */
    .card-extra {
      display: none; font-size: 11px; color: #64748b; line-height: 1.5;
      border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px;
    }
    .term-card.expanded .card-extra { display: block; }
    .card-actions {
      display: flex; gap: 6px; margin-top: 4px;
    }
    .card-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 4px 10px; border-radius: 8px;
      font-size: 11px; cursor: pointer; transition: all .15s;
    }
    .card-btn:hover { border-color: var(--accent); color: var(--accent); }
    .card-btn.tts-btn:hover { border-color: #34d399; color: #34d399; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 14px; grid-column: 1/-1;
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .vocab-grid { grid-template-columns: 1fr; padding: 0 10px 60px; }
      .search-bar { padding: 12px 10px 6px; }
      #vocab-search { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="v6-topbar">
    <a href="index.html">← 返回</a>
    <span class="tb-title">📖 互動詞庫</span>
    <span class="spacer"></span>
    <span class="count-badge" id="stage-badge" style="display:none;"></span>
    <span class="count-badge" id="count-badge">— 個術語</span>
  </header>

  <!-- Search -->
  <div class="search-bar">
    <input id="vocab-search" type="search" placeholder="搜尋術語、英文縮寫、定義內容…" autocomplete="off" />
  </div>

  <!-- Category tabs -->
  <nav class="domain-nav" id="cat-nav">
    <button class="cat-tab active" data-cat="" style="--tab-color:var(--accent)">
      <span class="dot" style="background:var(--accent)"></span>全部
    </button>
  </nav>

  <!-- Stats -->
  <div class="stats-bar" id="stats-bar">載入中…</div>

  <!-- Card grid -->
  <div class="vocab-grid" id="vocab-grid"></div>

  <script src="js/providers.js"></script>
  <script src="data.js?v=20260808"></script>
  <script>
    // ── 分類顏色對應 ──
    const CAT_COLOR = {
      '機器學習': 'var(--cat-ml)', '深度學習': 'var(--cat-dl)',
      '神經網路': 'var(--cat-nn)', '生成式 AI': 'var(--cat-gen)',
      '電腦視覺': 'var(--cat-cv)', 'NLP': 'var(--cat-nlp)',
      'AI 代理人': 'var(--cat-agt)'
    };

    function catColor(cat) {
      if (!cat) return 'var(--cat-def)';
      for (const [k, v] of Object.entries(CAT_COLOR)) {
        if (cat.includes(k) || k.includes(cat.split('\n')[0].trim())) return v;
      }
      return 'var(--cat-def)';
    }

    // ── 扁平化 data.js（支援舊版巢狀結構與新版扁平陣列）──
    const allTerms = [];
    if (typeof lessonData !== 'undefined') {
      lessonData.forEach(item => {
        // 新版：每筆 item 直接是術語（有 title 欄位）
        if (item.title) {
          const cat = (item.category || '').split('\n')[0].trim() || 'AI 基礎';
          allTerms.push({
            id:   item.id,
            title: item.title    || '',
            eng:   item.eng_name || '',
            abbr:  item.eng_abbr || '',
            cat,
            def:   item.def      || '',
            goal:  item.key_goal || '',
            apps:  item.common_apps || '',
            stage: item.stage != null ? String(item.stage) : ''
          });
        } else {
          // 舊版：section → sub_units → topics 三層結構
          (item.sub_units || []).forEach(sub => {
            (sub.topics || []).forEach(t => {
              const cat = (t.category || '').split('\n')[0].trim() || 'AI 基礎';
              allTerms.push({
                id:   t.id,
                title: t.title    || '',
                eng:   t.eng_name || '',
                abbr:  t.eng_abbr || '',
                cat,
                def:   t.def      || '',
                goal:  t.key_goal || '',
                apps:  t.common_apps || '',
                stage: t.stage != null ? String(t.stage) : ''
              });
            });
          });
        }
      });
    }

    // ── Stage 篩選（?stage=N，來自 stage-hub.html）：整批限縮 allTerms，
    //    非該 Stage 的術語直接隱藏，不是淡化 ──
    const STAGE_NAMES = { '0': 'AI 入門', '1': 'iPAS 初級', '2': '中級技術', '3': '中級數據' };
    const _stageParam = new URLSearchParams(location.search).get('stage');
    const activeStage = STAGE_NAMES.hasOwnProperty(_stageParam) ? _stageParam : null;
    let scopedTerms = allTerms;
    if (activeStage) {
      scopedTerms = allTerms.filter(t => t.stage === activeStage);
      allTerms.length = 0;
      allTerms.push(...scopedTerms);
    }

    // ── 建立分類導覽 ──
    const catCounts = {};
    allTerms.forEach(t => { catCounts[t.cat] = (catCounts[t.cat] || 0) + 1; });
    const topCats = Object.entries(catCounts)
      .sort((a,b) => b[1]-a[1]).slice(0, 12);

    const nav = document.getElementById('cat-nav');
    topCats.forEach(([cat, cnt]) => {
      const col = catColor(cat);
      const btn = document.createElement('button');
      btn.className = 'cat-tab';
      btn.dataset.cat = cat;
      btn.style.cssText = `--tab-color:${col}`;
      btn.innerHTML = `<span class="dot" style="background:${col}"></span>${cat} <span style="opacity:.5">${cnt}</span>`;
      nav.appendChild(btn);
    });

    // ── 狀態 ──
    let currentCat = '';
    let currentQuery = '';

    function getFiltered() {
      return allTerms.filter(t => {
        const matchCat = !currentCat || t.cat.includes(currentCat) || currentCat.includes(t.cat.split('\n')[0]);
        const q = currentQuery.toLowerCase();
        const matchQ = !q || t.title.toLowerCase().includes(q)
          || t.eng.toLowerCase().includes(q) || t.abbr.toLowerCase().includes(q)
          || t.def.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q);
        return matchCat && matchQ;
      });
    }

    // ── 建立卡片 HTML ──
    function renderCards() {
      const terms = getFiltered();
      const grid = document.getElementById('vocab-grid');
      document.getElementById('stats-bar').textContent =
        `顯示 ${terms.length} / ${allTerms.length} 個術語`;
      document.getElementById('count-badge').textContent = `${allTerms.length} 個術語`;
      if (activeStage) {
        const b = document.getElementById('stage-badge');
        b.textContent = '🎯 ' + STAGE_NAMES[activeStage] + ' 範圍';
        b.style.display = '';
      }

      if (!terms.length) {
        grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div>找不到符合的術語，試試其他關鍵字</div>`;
        return;
      }

      grid.innerHTML = '';
      const frag = document.createDocumentFragment();
      terms.forEach(t => {
        const col = catColor(t.cat);
        const card = document.createElement('div');
        card.className = 'term-card';
        card.style.cssText = `--card-color:${col}`;
        card.innerHTML = `
          <div class="card-header">
            <div class="card-cat-dot"></div>
            <div class="card-titles">
              <div class="card-title">${t.title}</div>
              <div class="card-eng">${[t.eng, t.abbr ? '（'+t.abbr+'）' : ''].filter(Boolean).join(' ')}</div>
            </div>
            <span class="card-cat-badge">${t.cat}</span>
          </div>
          <div class="card-def">${t.def || '—'}</div>
          <div class="card-extra">${[
            t.goal ? `<b>學習重點：</b>${t.goal}` : '',
            t.apps ? `<b>應用場景：</b>${t.apps}` : ''
          ].filter(Boolean).join('<br>')}</div>
          <div class="card-actions">
            <button class="card-btn tts-btn" data-speak="${t.title}。${t.def}">🔊 朗讀</button>
            <a class="card-btn" href="chat.html?term=${encodeURIComponent(t.title)}" target="_blank">💬 問 AI</a>
            <a class="card-btn" href="learn.html" target="_blank">📚 SRS</a>
          </div>`;
        frag.appendChild(card);
      });
      grid.appendChild(frag);
    }

    // ── TTS ──
    const _CF_URL = (window.AI_PROVIDERS && window.AI_PROVIDERS.cf_worker_url) || '';
    async function speakViaCF(text) {
      if (!_CF_URL) return false;
      try {
        const res = await fetch(_CF_URL.replace(/\/?$/, '/tts'), {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({text})
        });
        if (!res.ok) return false;
        const url = URL.createObjectURL(await res.blob());
        const a = new Audio(url);
        a.onended = () => URL.revokeObjectURL(url);
        await a.play(); return true;
      } catch { return false; }
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { speakViaCF(text); return; }
      speechSynthesis.cancel();
      const doSpeak = (voices) => {
        const msVoice = voices.find(v => /Microsoft.*HsiaoChen/i.test(v.name))
          || voices.find(v => /Microsoft.*(HsiaoYu|Yating)/i.test(v.name))
          || voices.find(v => /Microsoft/i.test(v.name) && v.lang === 'zh-TW')
          || null;
        if (msVoice) {
          const utt = new SpeechSynthesisUtterance(text);
          utt.lang = 'zh-TW'; utt.rate = 0.9; utt.voice = msVoice;
          speechSynthesis.speak(utt);
        } else {
          speakViaCF(text).then(ok => {
            if (!ok) {
              const utt = new SpeechSynthesisUtterance(text);
              utt.lang = 'zh-TW'; utt.rate = 0.9;
              speechSynthesis.speak(utt);
            }
          });
        }
      };
      const voices = speechSynthesis.getVoices();
      if (voices.length > 0) { doSpeak(voices); }
      else {
        speechSynthesis.onvoiceschanged = () => { speechSynthesis.onvoiceschanged = null; doSpeak(speechSynthesis.getVoices()); };
        setTimeout(() => { if (!speechSynthesis.getVoices().length) speakViaCF(text); }, 2000);
      }
    }

    // ── 事件：展開卡片 + TTS ──
    document.getElementById('vocab-grid').addEventListener('click', e => {
      const btn = e.target.closest('.tts-btn');
      if (btn) { e.stopPropagation(); speak(btn.dataset.speak); return; }
      if (e.target.closest('.card-btn')) return; // other buttons
      const card = e.target.closest('.term-card');
      if (card) card.classList.toggle('expanded');
    });

    // ── 事件：分類 tab ──
    nav.addEventListener('click', e => {
      const btn = e.target.closest('.cat-tab');
      if (!btn) return;
      nav.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      renderCards();
    });

    // ── 事件：搜尋 ──
    let searchTimer;
    document.getElementById('vocab-search').addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        currentQuery = e.target.value.trim();
        renderCards();
      }, 200);
    });

    // ── 初始渲染 ──
    speechSynthesis?.getVoices(); // preload voices
    renderCards();
  </script>
</body>
</html>
