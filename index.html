<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPas AI 應用規劃師</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#060b13; margin:0; overflow:hidden;">
    <canvas id="particles-bg"></canvas>
    <div class="header-bar">
        <div class="hud glass-panel" id="progress-hud">
            <span>📊 SRS進度</span>
            <span id="srs-progress">載入中...</span>
        </div>
    </div>
    <div class="hero">
        <h1>iPas AI 應用規劃師</h1>
        <p id="typing-subtitle" class="subtitle"></p>
    </div>
    <div class="card-container">
        <a href="learn.html" class="card glass-panel">
            <div class="card-icon">📖</div>
            <div class="card-title">SRS學習</div>
            <div class="card-desc">間隔重複系統</div>
        </a>
        <a href="atlas.html" class="card glass-panel">
            <div class="card-icon">🌟</div>
            <div class="card-title">概念星圖</div>
            <div class="card-desc">知識連結可視化</div>
        </a>
        <a href="chat.html" class="card glass-panel">
            <div class="card-icon">💬</div>
            <div class="card-title">AI對話</div>
            <div class="card-desc">與AI討論概念</div>
        </a>
        <a href="quiz.html" class="card glass-panel">
            <div class="card-icon">⚡</div>
            <div class="card-title">測驗挑戰</div>
            <div class="card-desc">檢驗學習成果</div>
        </a>
    </div>
    <script type="module">
        import { ParticleSystem } from './js/particles.js';
        const canvas = document.getElementById('particles-bg');
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.zIndex = '-1';
        new ParticleSystem(canvas);
    </script>
    <script>
        // typing effect
        const text = "AI-powered Spaced Repetition & Knowledge Atlas";
        let i = 0;
        const el = document.getElementById('typing-subtitle');
        function type() {
            if (i < text.length) {
                el.textContent += text.charAt(i);
                i++;
                setTimeout(type, 50);
            }
        }
        type();
        // progress hud from localStorage
        const prog = document.getElementById('srs-progress');
        try {
            const data = JSON.parse(localStorage.getItem('srsData') || '{}');
            const total = data.total || 0;
            const due = data.due || 0;
            const pct = total > 0 ? Math.round((1 - due/total)*100) : 0;
            prog.textContent = total + ' 卡片 | 待複習 ' + due + ' (' + pct + '%)';
        } catch(e) {
            prog.textContent = '暫無資料';
        }
    </script>
</body>
</html>
