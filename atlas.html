<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 知識星圖 · Atlas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060b13; color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── 粒子背景畫布 ── */
    #atlas-bg {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    /* ── Topbar ── */
    .v6-topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 200;
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
      background: rgba(6,11,19,0.92); border-bottom: 1px solid rgba(125,211,252,0.15);
      backdrop-filter: blur(12px);
    }
    .v6-topbar a { color: #9ca3af; text-decoration: none; font-size: 13px; }
    .v6-topbar a:hover { color: #7dd3fc; }
    .v6-topbar .tb-title { color: #7dd3fc; font-weight: 600; font-size: 14px; }
    .search-box { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    #atlas-search {
      background: rgba(11,15,25,0.9); border: 1px solid rgba(125,211,252,0.25);
      color: #cdd6f4; padding: 5px 12px; border-radius: 16px;
      font-size: 12px; width: 180px; outline: none;
    }
    #atlas-search:focus { border-color: #7dd3fc; }
    #atlas-reset {
      background: none; border: 1px solid rgba(125,211,252,0.25);
      color: #94a3b8; padding: 4px 10px; border-radius: 8px;
      cursor: pointer; font-size: 12px;
    }
    #atlas-reset:hover { border-color: #7dd3fc; color: #7dd3fc; }

    /* ── 模式切換列（功能導向 / 學習導向）── */
    .mode-nav {
      position: fixed; top: 44px; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; gap: 4px; padding: 5px 16px;
      background: rgba(6,11,19,0.95); border-bottom: 1px solid rgba(125,211,252,0.18);
    }
    .mode-btn {
      padding: 4px 16px; border-radius: 14px; font-size: 12px; cursor: pointer;
      border: 1px solid rgba(125,211,252,0.25); background: none; color: #64748b;
      transition: all .2s; font-weight: 500;
    }
    .mode-btn:hover { color: #94a3b8; }
    .mode-btn.active {
      background: rgba(125,211,252,0.12); color: #7dd3fc;
      border-color: #7dd3fc; box-shadow: 0 0 8px rgba(125,211,252,0.2);
    }
    .mode-btn.learn-active {
      background: rgba(251,191,36,0.12); color: #fbbf24;
      border-color: #fbbf24; box-shadow: 0 0 8px rgba(251,191,36,0.2);
    }

    /* ── Domain nav ── */
    .domain-nav {
      position: fixed; top: 76px; left: 0; right: 0; z-index: 190;
      display: flex; gap: 6px; padding: 7px 16px; overflow-x: auto;
      background: rgba(6,11,19,0.88); border-bottom: 1px solid rgba(125,211,252,0.08);
      scrollbar-width: none; backdrop-filter: blur(8px);
    }
    .domain-nav::-webkit-scrollbar { display: none; }
    .domain-tab {
      flex-shrink: 0; padding: 4px 14px; border-radius: 16px;
      border: 1px solid rgba(125,211,252,0.2); background: none;
      color: #94a3b8; font-size: 12px; cursor: pointer;
      transition: all .2s; white-space: nowrap;
    }
    .domain-tab:hover { background: rgba(125,211,252,0.08); color: #7dd3fc; }
    .domain-tab.active {
      border-color: var(--tab-color, #7dd3fc);
      color: var(--tab-color, #7dd3fc);
      background: rgba(125,211,252,0.1);
      box-shadow: 0 0 8px rgba(125,211,252,0.25);

    .domain-tab[data-cat="GEN"]  { --tab-color: #7dd3fc; }
    .domain-tab[data-cat="CV"]   { --tab-color: #f472b6; }
    .domain-tab[data-cat="NLP"]  { --tab-color: #fb923c; }

    .learn-tab[data-lcat="UL"]    { --ltab-color: #34d399; }
    .learn-tab[data-lcat="DL"]    { --ltab-color: #fbbf24; }

    .learn-tab[data-lcat="RL"]    { --ltab-color: #fb923c; }

      background: rgba(6,11,19,0.97); border-left: 1px solid rgba(125,211,252,0.2);
      backdrop-filter: blur(16px); transition: right .3s ease;

    #atlas-panel.show { right: 0; }
    .panel-close {

    .panel-btn {

  <!-- 粒子背景動畫 -->
  <script>
  (function() {
    const canvas = document.getElementById('atlas-bg');
    const ctx = canvas.getContext('2d');

    const COLORS = ['#a78bfa','#7dd3fc','#34d399','#fbbf24','#f472b6','#fb923c','#c084fc'];
    const COUNT = 90;
    const LINK_DIST = 130;
    const LINK_ALPHA = 0.18;

    let W, H, particles = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function rnd(a, b) { return a + Math.random() * (b - a); }

    function init() {
      resize();
      particles = Array.from({ length: COUNT }, () => ({
        x: rnd(0, W), y: rnd(0, H),
        vx: rnd(-0.18, 0.18), vy: rnd(-0.18, 0.18),
        r: rnd(1.2, 2.8),
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        alpha: rnd(0.25, 0.65)
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Draw connections
      for (let i = 0; i < COUNT; i++) {
        for (let j = i + 1; j < COUNT; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < LINK_DIST) {
            const a = LINK_ALPHA * (1 - dist / LINK_DIST);
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(125,211,252,${a})`;
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }

      // Draw nodes
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color + Math.round(p.alpha * 255).toString(16).padStart(2,'0');
        ctx.fill();
        // subtle glow
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = p.color + '14';
        ctx.fill();
      });
    }

    function tick() {
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < -10) p.x = W + 10;
        if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10;
        if (p.y > H + 10) p.y = -10;
      });
      draw();
      requestAnimationFrame(tick);
    }

    window.addEventListener('resize', () => {
      resize();
      // keep particles in new bounds
      particles.forEach(p => {
        if (p.x > W) p.x = W * Math.random();
        if (p.y > H) p.y = H * Math.random();
      });
    });

    init();
    tick();
  })();
  </script>

  <script>
    // 扁平化 lessonData → topics（支援舊版巢狀結構與新版扁平陣列）
    const topics = [];
    if (typeof lessonData !== 'undefined') {
      lessonData.forEach(item => {
        // 新版：每筆 item 直接是術語（有 title 欄位）
        if (item.title) {
          const rawCat = (item.category || '').split('\n')[0].trim() || 'AI 基礎';
          topics.push({
            id:       String(item.id || Math.random()),
            title:    item.title    || '',
            eng_name: item.eng_name || item.eng_abbr || '',
            category: rawCat,
            def:      item.def      || '',
            key_goal: item.key_goal || '',
            stage:    item.stage != null ? String(item.stage) : ''
          });
        } else {
          // 舊版：section → sub_units → topics 三層結構
          (item.sub_units || []).forEach(sub => {
            (sub.topics || []).forEach(t => {
              const rawCat = (t.category || '').split('\n')[0].trim() || 'AI 基礎';
              topics.push({
                id:       String(t.id || Math.random()),
                title:    t.title    || '',
                eng_name: t.eng_name || t.eng_abbr || '',
                category: rawCat,
                def:      t.def      || '',
                key_goal: t.key_goal || '',
                stage:    t.stage != null ? String(t.stage) : ''
              });
            });
          });
        }
      });
    }

    const atlas = new TermAtlas(document.getElementById('atlas-container'), topics);
    // 初始隱藏 D3 atlas（預設顯示星圖）
    atlas.svg.style('display', 'none');

    // 傳入同一份 topics，以 AI 術語作為星點
    const starMap = new ConstellationAtlas(document.getElementById('atlas-container'), topics);
    starMap.show();

    let currentMode = 'star';

    function _setActiveTab(key) {
      document.querySelectorAll('.domain-tab').forEach(b =>
        b.classList.toggle('active', b.getAttribute('data-cat') === key));
    }

    function _showStarUI(title) {
      starMap.show();
      atlas.svg.style('display', 'none');
      document.getElementById('atlas-mode-title').textContent = title;
      document.getElementById('atlas-rotate-toggle').style.display = '';
      document.getElementById('legend-star').style.display  = '';
      document.getElementById('legend-atlas').style.display = 'none';
    }

    function _showAtlasUI(title) {
      starMap.hide();
      atlas.svg.style('display', '');
      document.getElementById('atlas-mode-title').textContent = title;
      document.getElementById('atlas-rotate-toggle').style.display = 'none';
      document.getElementById('legend-star').style.display  = 'none';
      document.getElementById('legend-atlas').style.display = '';
    }

    // 🌌 全覽圖：星象圖，所有分類全顯示
    function showStar() {
      currentMode = 'star';
      _showStarUI('🌌 AI 知識星圖（全覽）');
      starMap.filterCategory(null);
      _setActiveTab('STAR');
    }

    // 🔮 全部 AI：所有術語展開旋轉（同 star 模式，所有節點鋪滿畫面）
    function showSphere() {
      currentMode = 'star';
      _showStarUI('🔮 全部 AI');
      starMap.showAll();
      _setActiveTab('ALL');
    }

    // 分類頁籤：星象圖模式，只亮該分類 cluster
    function showCat(cat, key) {
      currentMode = 'star';
      _showStarUI('🌌 ' + cat);
      starMap.filterCategory(cat);
      _setActiveTab(key);
    }

    // 舊版 switchMode 相容（URL 參數 / reset 等處呼叫）
    function switchMode(mode) {
      if (mode === 'star') showStar();
      else showSphere();
    }

    // ── 學習導向模式切換 ────────────────────────────────────────────────────────
    let _viewMode = 'func'; // 'func' | 'learn'

    function setViewMode(mode) {
      _viewMode = mode;
      const funcNav  = document.getElementById('func-nav');
      const learnNav = document.getElementById('learn-nav');
      const modeFunc  = document.getElementById('mode-func');
      const modeLearn = document.getElementById('mode-learn');
      const legendStar  = document.getElementById('legend-star');
      const legendLearn = document.getElementById('legend-learn');
      if (mode === 'learn') {
        funcNav.style.display  = 'none';
        learnNav.style.display = 'flex';
        modeFunc.classList.remove('active');
        modeLearn.classList.add('learn-active');
        legendStar.style.display  = 'none';
        legendLearn.style.display = '';
        showLearnOverview();
      } else {
        learnNav.style.display = 'none';
        funcNav.style.display  = 'flex';
        modeLearn.classList.remove('learn-active');
        modeFunc.classList.add('active');
        legendLearn.style.display = 'none';
        legendStar.style.display  = '';
        starMap.restoreFromLearn();
        showStar();
      }
    }

    function _setActiveLTab(key) {
      document.querySelectorAll('.learn-tab').forEach(b =>
        b.classList.toggle('active', b.getAttribute('data-lcat') === key));
    }

    function showLearnOverview() {
      document.getElementById('atlas-mode-title').textContent = '📚 學習導向全覽';
      document.getElementById('atlas-rotate-toggle').style.display = '';
      starMap.show();
      atlas.svg.style('display', 'none');
      starMap.showLearnOverview();
      _setActiveLTab('LALL');
    }

    function showLearnCat(cat, key) {
      document.getElementById('atlas-mode-title').textContent = '📚 ' + cat;
      document.getElementById('atlas-rotate-toggle').style.display = '';
      starMap.show();
      atlas.svg.style('display', 'none');
      starMap.filterLearnCat(cat);
      _setActiveLTab(key);
    }

    // 學習星體點擊 callback
    starMap.onLearnCatClick = (cat) => {
      const keyMap = {
        'AI 入門':'INTRO','資料基礎':'DATA','監督式':'SL','鑑別式':'DISC',
        '非監督式':'UL','深度學習':'DL','生成式':'GEN','強化學習':'RL','中級進階':'ADV'
      };
      showLearnCat(cat, keyMap[cat] || 'INTRO');
    };

    // 旋轉切換按鈕
    document.getElementById('atlas-rotate-toggle').addEventListener('click', function() {
      const rotating = starMap.toggleRotation();
      this.textContent = rotating ? '⏸ 暫停' : '▶ 旋轉';
    });

    // URL 自動篩選: atlas.html?cat=機器學習
    const urlCat = new URLSearchParams(location.search).get('cat');
    if (urlCat) {
      const key = Object.entries({
        'ML':'機器學習','DL':'深度學習','NN':'神經網路','GEN':'生成式 AI',
        'CV':'電腦視覺','NLP':'NLP基礎','AGT':'AI 代理人','GOV':'AI 治理',
        'DS':'資料科學','APP':'AI 應用'
      }).find(([,v]) => v === urlCat)?.[0] || 'ML';
      showCat(urlCat, key);
    }

    // URL 自動篩選: atlas.html?stage=0（來自 stage-hub.html，只顯示該 Stage 的術語，
    // 未歸類/其他 Stage 節點整批隱藏，不是淡化）
    const urlStage = new URLSearchParams(location.search).get('stage');
    const STAGE_TITLES = { '0': '✦ AI 入門', '1': '🪐 iPAS 初級', '2': '🧠 中級技術', '3': '⚡ 中級數據' };
    if (urlStage && STAGE_TITLES[urlStage] && typeof starMap.filterStage === 'function') {
      currentMode = 'star';
      _showStarUI('🌌 ' + STAGE_TITLES[urlStage]);
      starMap.filterStage(urlStage);
      _setActiveTab('STAGE');
    }

    // 搜尋框（所有模式都走 starMap.search）
    document.getElementById('atlas-search').addEventListener('input', e => {
      starMap.search(e.target.value.trim());
    });

    // Reset 按鈕：回到全覽圖
    document.getElementById('atlas-reset').addEventListener('click', () => {
      document.getElementById('atlas-search').value = '';
      showStar();
    });

    // 行星點擊 → 導向該分類詳細頁
    const CAT_KEY_MAP = {
      '機器學習':'ML','深度學習':'DL','神經網路':'NN','生成式 AI':'GEN',
      '鑑別式 AI':'DISC','多模態 AI':'MM',
      '電腦視覺':'CV','NLP基礎':'NLP','AI 代理人':'AGT',
      'AI 治理':'GOV','資料科學':'DS','AI 應用':'APP'
    };
    starMap.onCatClick = (cat) => {
      const key = CAT_KEY_MAP[cat] || 'ML';
      showCat(cat, key);
    };

    // 節點點擊後面板加入導覽按鈕
    const origShowPanel = atlas.showPanel.bind(atlas);
    atlas.showPanel = function(node) {
      origShowPanel(node);
      const panel = document.getElementById('atlas-panel');
      const actions = document.createElement('div');
      actions.className = 'panel-actions';
      actions.innerHTML = `
        <a class="panel-btn" href="chat.html?term=${encodeURIComponent(node.title)}" target="_blank">💬 問 AI</a>
        <a class="panel-btn" href="vocab.html" target="_blank">📖 詞庫</a>`;
      panel.appendChild(actions);
    };
  </script>
</body>
</html>
