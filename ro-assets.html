let currentTab='enemies',searchVal='';
const grid=document.getElementById('grid');
const searchEl=document.getElementById('search');
const countEl=document.getElementById('count');
function buildGrid(){
  grid.innerHTML='';
  const cat=CATS[currentTab];
  const all=FILES[currentTab];
  const q=searchVal.toLowerCase();
  const filtered=q?all.filter(f=>f.replace(/_/g,' ').toLowerCase().includes(q)):all;
  countEl.textContent=filtered.length+' 個';
  filtered.forEach(fname=>{
    const card=document.createElement('div'); card.className='card';
    const img=document.createElement('img');
    img.src=cat.path+fname; img.loading='lazy';
    img.style.maxWidth=cat.maxW+'px'; img.style.maxHeight=cat.maxH+'px';
    const lbl=document.createElement('div'); lbl.className='lbl';
    lbl.textContent=fname.replace('.png','').replace(/_/g,' ');
    card.append(img,lbl); grid.appendChild(card);
  });
}
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab=btn.dataset.tab;
    searchEl.value=''; searchVal=''; buildGrid();
  });
});
searchEl.addEventListener('input',e=>{searchVal=e.target.value;buildGrid();});
buildGrid();
</script>
